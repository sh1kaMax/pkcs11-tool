[package]
name = "pkcs11-tool"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GUI for Rutoken PKCS#11 operations"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cryptoki = "0.8"
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
rfd = "0.15"
thiserror = "2.0"

